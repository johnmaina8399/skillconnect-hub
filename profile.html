<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SkillConnect Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2>SkillConnect <span>Hub</span></h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="skills.html">Explore Skills</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<section class="form-container">
    <h1>My Profile</h1>
    <div class="profile-icon">👤</div>

    <h2>Welcome to Your Profile</h2>
    <p>Manage your personal and professional information.</p>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Your full name">

        <label>Email</label>
        <input type="email" placeholder="Your email">

        <label>Your Skills</label>
        <input type="text" placeholder="e.g. Web Development">

        <label>About You</label>
        <textarea placeholder="Describe your skills and experience"></textarea>

        <button type="submit" class="btn">Update Profile</button>
    </form>
</section>

<footer>
    <p>© 2026 SkillConnect Hub. All Rights Reserved.</p>
</footer>

</body>
</html>
