<!DOCTYPE html>
<html lang="en">
<head>

    <title>Contact Us | SkillConnect Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2>SkillConnect <span>Hub</span></h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Explore Skills</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<section class="page-header">
    <h1>Contact Us</h1>
    <p>We would love to hear from you.</p>
</section>

<section class="form-container">
    <h2>Send Us a Message</h2>

    <form>
        <label>Your Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Subject</label>
        <input type="text" placeholder="Message subject" required>

        <label>Message</label>
        <textarea placeholder="Write your message here" required></textarea>

        <button type="submit" class="btn">Send Message</button>
    </form>
</section>

<footer>
    <p>© 2026 SkillConnect Hub. All Rights Reserved.</p>
</footer>

</body>
</html>
